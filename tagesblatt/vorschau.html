<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Verlauf-Vorschau</title>
<style>
  :root{ --bg:#111; --text:#f6f6f6; --muted:#9a9a9a; }
  *{ box-sizing:border-box; margin:0; }
  body{ background:var(--bg); color:var(--text); font:14px/1.4 ui-monospace,Menlo,Consolas,monospace; padding:16px; }
  header{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  h1{ font-size:20px; margin-right:auto; }
  select,input,button{ font:inherit; background:#000; color:var(--text); border:1px solid #555; padding:6px 8px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .tag{ border:1px solid #333; background:#000; }
  .tag.heute{ outline:2px solid var(--text); }
  .flaeche{ height:150px; }
  .info{ padding:6px 8px; font-size:12px; }
  .info b{ display:block; font-size:13px; }
  .info span{ color:var(--muted); }
  .chips{ display:flex; gap:3px; margin-top:4px; }
  .chips i{ width:16px; height:16px; border:1px solid #555; }
  p{ color:var(--muted); margin:-6px 0 14px; max-width:70ch; }
</style>
</head>
<body>
<header>
  <h1>Verlauf-Vorschau</h1>
  <label>Look <select id="skin"></select></label>
  <label>ab <input type="date" id="ab"></label>
  <label>Tage <input type="number" id="tage" value="42" min="7" max="366" style="width:5em"></label>
</header>
<p>Nur zum Bearbeiten am Rechner: Änderungen in <code>themes/&lt;look&gt;/gradient.js</code> speichern und diese Seite neu laden.</p>
<div class="grid" id="grid"></div>
<script type="module">
  import { SKINS } from "./js/themes.js";
  import * as U from "./js/util.js";
  const $ = (s) => document.querySelector(s);
  const q = new URLSearchParams(location.search);
  $("#skin").innerHTML = Object.entries(SKINS).map(([id, s]) => `<option value="${id}">${s.label}</option>`).join("");
  $("#skin").value = q.get("skin") && SKINS[q.get("skin")] ? q.get("skin") : Object.keys(SKINS)[0];
  $("#ab").value = U.todayKey();
  function zeichne() {
    const skin = SKINS[$("#skin").value];
    const start = U.fromKey($("#ab").value || U.todayKey());
    const n = Math.min(366, Math.max(1, +$("#tage").value || 42));
    let html = "";
    for (let i = 0; i < n; i++) {
      const d = U.addDays(start, i), k = U.keyOf(d), g = skin.gradient(k);
      html += `<div class="tag ${k === U.todayKey() ? "heute" : ""}" title="${g.css}">
        <div class="flaeche" style="background:${g.css}"></div>
        <div class="info"><b>${U.fmtShort(d)}</b>${U.esc(g.name)}<br><span>${g.modus} · #${g.nummer}</span>
        <div class="chips">${[...new Set(g.stops)].map((c) => `<i style="background:${c}" title="${c}"></i>`).join("")}<i style="background:${g.akzentHell}" title="Akzent ${g.akzentHell}"></i></div></div>
      </div>`;
    }
    $("#grid").innerHTML = html;
  }
  ["#skin", "#ab", "#tage"].forEach((s) => $(s).addEventListener("input", zeichne));
  zeichne();
</script>
</body>
</html>
